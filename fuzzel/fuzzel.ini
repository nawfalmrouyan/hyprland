font=Pragmasevka Nerd Font:size=10
use-bold=yes
dpi-aware=auto
icon-theme=Adwaita-purple
icons-enabled=yes
terminal=uwsm app -- kitty -e
launch-prefix=uwsm app --
width=70
exit-on-keyboard-focus-loss=no
list-executables-in-path=yes
match-counter=yes
show-actions=yes
line-height=15
letter-spacing=0.2
inner-pad=15
vertical-pad=15
horizontal-pad=25

[border]
width=3
radius=0

[dmenu]
mode=text  # text|index
exit-immediately-if-empty=no

[colors]
background=1e1e2eff
text=cdd6f4ff
prompt=bac2deff
placeholder=7f849cff
input=cdd6f4ff
match=cba6f7ff
selection=585b70ff
selection-text=cdd6f4ff
selection-match=cba6f7ff
counter=7f849cff
border=cba6f7ff
