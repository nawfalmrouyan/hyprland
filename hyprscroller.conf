plugin {
    scroller {
        column_default_width = threequarters
        window_default_height = one
        focus_wrap = true
        column_widths = threequarters one onefourth onehalf
        window_heights = threequarters one onefourth onethird
        cyclesize_closest = true
        jump_labels_color = $mauve
        gesture_sensitivity = 2
        gesture_scroll_enable = true
        gesture_scroll_fingers = 3
        gesture_overview_enable = true
        gesture_overview_fingers = 4
        gesture_workspace_switch_enable = true
        gesture_workspace_switch_prefix = r
        overview_scale_content = true
    }
}

# Move focus with mainMod + hjkl
bind = $mainMod, H, scroller:movefocus, l
bind = $mainMod, L, scroller:movefocus, r
bind = $mainMod, K, scroller:movefocus, u
bind = $mainMod, J, scroller:movefocus, d
bind = $mainMod, home, scroller:movefocus, begin
bind = $mainMod, end, scroller:movefocus, end

# focus submap
# bind = $mainMod SHIFT, F, submap, focus
# submap = focus
# bind = , H, scroller:movefocus, l
# bind = , L, scroller:movefocus, r
# bind = , K, scroller:movefocus, u
# bind = , J, scroller:movefocus, d
# bind = , home, scroller:movefocus, begin
# bind = , end, scroller:movefocus, end
# bind = , escape, submap, reset
# submap = reset

# Movement
bind = $mainMod CTRL, H, scroller:movewindow, l
bind = $mainMod CTRL, L, scroller:movewindow, r
bind = $mainMod CTRL, K, scroller:movewindow, u
bind = $mainMod CTRL, J, scroller:movewindow, d
bind = $mainMod CTRL, home, scroller:movewindow, begin
bind = $mainMod CTRL, end, scroller:movewindow, end
bind = $mainMod ALT, H, scroller:movewindow, l, nomode
bind = $mainMod ALT, L, scroller:movewindow, r, nomode
bind = $mainMod ALT, K, scroller:movewindow, u, nomode
bind = $mainMod ALT, J, scroller:movewindow, d, nomode
bind = $mainMod ALT, home, scroller:movewindow, begin, nomode
bind = $mainMod ALT, end, scroller:movewindow, end, nomode

# Move submap
bind = $mainMod SHIFT, M, submap, move
submap = move
bind = , H, scroller:movewindow, l
bind = , L, scroller:movewindow, r
bind = , K, scroller:movewindow, u
bind = , J, scroller:movewindow, d
bind = , home, scroller:movewindow, begin
bind = , end, scroller:movewindow, end
bind = , escape, submap, reset
submap = reset

# Modes
bind = $mainMod, bracketleft, scroller:setmode, row
bind = $mainMod, bracketright, scroller:setmode, col

# Set Mode Modifiers submap
bind = $mainMod, backslash, submap, modifiers
submap = modifiers, reset
bind = , right, scroller:setmodemodifier, after
bind = , left, scroller:setmodemodifier, before
bind = , home, scroller:setmodemodifier, beginning
bind = , end, scroller:setmodemodifier, end
bind = , up, scroller:setmodemodifier, focus
bind = , down, scroller:setmodemodifier, nofocus
bind = , 2, scroller:setmodemodifier, auto:2
bind = , 3, scroller:setmodemodifier, auto:3
bind = , m, scroller:setmodemodifier, manual
bind = , c, scroller:setmodemodifier, center_column
bind = SHIFT, c, scroller:setmodemodifier, nocenter_column
bind = , w, scroller:setmodemodifier, center_window
bind = SHIFT, w, scroller:setmodemodifier, nocenter_window
bind = , escape, submap, reset
submap = reset

# Sizing keys
# bind = $mainMod, equal, scroller:cyclesize, next
# bind = $mainMod, minus, scroller:cyclesize, prev
bind = $mainMod, equal, scroller:cyclewidth, next
bind = $mainMod, minus, scroller:cyclewidth, prev
bind = $mainMod SHIFT, equal, scroller:cycleheight, next
bind = $mainMod SHIFT, minus, scroller:cycleheight, prev

# Sizes submap
bind = $mainMod, s, submap, sizing
submap = sizing, reset
bind = , 1, scroller:setsize, oneeighth
bind = , 2, scroller:setsize, onesixth
bind = , 3, scroller:setsize, onefourth
bind = , 4, scroller:setsize, onethird
bind = , 5, scroller:setsize, threeeighths
bind = , 6, scroller:setsize, onehalf
bind = , 7, scroller:setsize, fiveeighths
bind = , 8, scroller:setsize, twothirds
bind = , 9, scroller:setsize, threequarters
bind = , 0, scroller:setsize, fivesixths
bind = , minus, scroller:setsize, seveneighths
bind = , equal, scroller:setsize, one
bind = , escape, submap, reset
submap = reset

# Admit/Expel
bind = $mainMod, left, scroller:admitwindow, l
bind = $mainMod, right, scroller:admitwindow, r
bind = $mainMod SHIFT, right, scroller:expelwindow, r
bind = $mainMod SHIFT, left, scroller:expelwindow, l

# Center submap
bind = $mainMod, X, submap, center
submap = center, reset
# sets repeatable binds for resizing the active window
bind = , C, scroller:alignwindow, c
bind = , M, scroller:alignwindow, m
bind = , L, scroller:alignwindow, r
bind = , H, scroller:alignwindow, l
bind = , K, scroller:alignwindow, u
bind = , J, scroller:alignwindow, d
# use reset to go back to the global submap
bind = , escape, submap, reset
submap = reset

# Resize submap
bind = $mainMod, R, submap, resize
submap = resize
binde = , L, resizeactive, 100 0
binde = , H, resizeactive, -100 0
binde = , K, resizeactive, 0 -100
binde = , J, resizeactive, 0 100
bind = , escape, submap, reset
submap = reset

# Fit size submap
bind = $mainMod, D, submap, fitsize
submap = fitsize, reset
# sets binds for fitting columns/windows in the screen
bind = , W, scroller:fitsize, visible
bind = , L, scroller:fitsize, toend
bind = , right, scroller:fitsize, toend
bind = , H, scroller:fitsize, tobeg
bind = , left, scroller:fitsize, tobeg
bind = , K, scroller:fitsize, active
bind = , up, scroller:fitsize, active
bind = , J, scroller:fitsize, all
bind = , down, scroller:fitsize, all
bind = , bracketleft, scroller:fitwidth, all
bind = , bracketright, scroller:fitheight, all
bind = , escape, submap, reset
submap = reset

# overview keys
# bind key to toggle overview (normal)
bind = $mainMod, tab, scroller:toggleoverview
bind = ,mouse:275, scroller:toggleoverview

# Marks
bind = $mainMod, M, submap, marksadd
submap = marksadd, reset
bind = , a, scroller:marksadd, a
bind = , b, scroller:marksadd, b
bind = , c, scroller:marksadd, c
bind = , d, scroller:marksadd, d
bind = , e, scroller:marksadd, e
bind = , f, scroller:marksadd, f
bind = , g, scroller:marksadd, g
bind = , o, scroller:marksadd, o
bind = , t, scroller:marksadd, t
bind = , escape, submap, reset
submap = reset

bind = $mainMod SHIFT, M, submap, marksdelete
submap = marksdelete, reset
bind = , a, scroller:marksdelete, a
bind = , b, scroller:marksdelete, b
bind = , c, scroller:marksdelete, c
bind = , d, scroller:marksdelete, d
bind = , e, scroller:marksdelete, e
bind = , f, scroller:marksdelete, f
bind = , g, scroller:marksdelete, g
bind = , o, scroller:marksdelete, o
bind = , t, scroller:marksdelete, t
bind = , escape, submap, reset
submap = reset

bind = $mainMod, apostrophe, submap, marksvisit
submap = marksvisit, reset
bind = , a, scroller:marksvisit, a
bind = , b, scroller:marksvisit, b
bind = , c, scroller:marksvisit, c
bind = , d, scroller:marksvisit, d
bind = , e, scroller:marksvisit, e
bind = , f, scroller:marksvisit, f
bind = , g, scroller:marksvisit, g
bind = , o, scroller:marksvisit, o
bind = , t, scroller:marksvisit, t
bind = , escape, submap, reset
submap = reset

bind = $mainMod CTRL, M, scroller:marksreset

# Pin
bind = $mainMod, C, scroller:pin,

# Window copy/paste
bind = $mainMod, Insert, scroller:selectiontoggle,
bind = $mainMod CTRL, Insert, scroller:selectionreset,
bind = $mainMod SHIFT, Insert, scroller:selectionmove, right
bind = $mainMod CTRL SHIFT, Insert, scroller:selectionworkspace,

# Trails and Trailmarks
bind = $mainMod SHIFT, semicolon, submap, trail
submap = trail
bind = , bracketright, scroller:trailnext,
bind = , bracketleft, scroller:trailprevious,
bind = , semicolon, scroller:trailnew,
bind = , semicolon, submap, reset
bind = , d, scroller:traildelete,
bind = , d, submap, reset
bind = , c, scroller:trailclear,
bind = , c, submap, reset
bind = , Insert, scroller:trailtoselection,
bind = , Insert, submap, reset
bind = , escape, submap, reset
submap = reset

bind = $mainMod, semicolon, submap, trailmark
submap = trailmark
bind = , bracketright, scroller:trailmarknext,
bind = , bracketleft, scroller:trailmarkprevious,
bind = , semicolon, scroller:trailmarktoggle,
bind = , semicolon, submap, reset
bind = , escape, submap, reset
submap = reset

bind = $mainMod, slash, scroller:jump,

windowrule = scroller:marks_add g, match:initial_class (Apache Directory Studio)
windowrule = scroller:marks_add f, match:initial_class zen
windowrule = scroller:marks_add t, match:class teams-for-linux
windowrule = scroller:marks_add o, match:class outlook-for-linux
windowrule = border_size 1 border_color rgb(eeee00) rgb(00eeee), match:tag scroller:pinned
windowrule = scroller:column_width onehalf, match:class kitty
