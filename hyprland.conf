  # workspace_swipe_cancel_ratio = 0.15
# }

layerrule = blur, logout_dialog
layerrule = ignorezero, logout_dialog
layerrule = blur, rofi
# layerrule = ignorezero, rofi
layerrule = dimaround, rofi
layerrule = blur, vicinae
# layerrule = ignorezero, vicinae
layerrule = animation popin, vicinae
layerrule = dimaround, vicinae

# whatsapp rules
windowrule = float, size 1600 960, center, workspace special:whatsapp silent, class:(whatsappweb-nativefier-d40211)

# telegram rules
windowrule = float, size 1600 960, center, workspace special:whatsapp silent, class:(org.telegram.desktop)

# youtube music rules
windowrule = float, size 1600 960, center, workspace special:trash silent, class:(com.github.th_ch.youtube_music)

# spotube rules
windowrule = float, size 1600 960, center, workspace special:spotube silent, class:^(spotube)$

# showmethekey rules
windowrule = move 1511 919, float, noborder, opacity 1.0 override 1.0 override, noblur, nofocus, noanim, noshadow, class:(showmethekey-gtk)

# grouping rules
windowrule = group, class:(whatsappweb-nativefier-d40211|org.telegram.desktop|org.remmina.Remmina|spotube|com.github.th_ch.youtube_music)
windowrule = group override barred, class:(kitty|zen)

# misc rules
windowrule = center, title:(LibreOffice)
windowrule = float, class:(yad|nm-connection-editor|pavucontrol|Rofi|feh|Gimp|qt5ct)
windowrule = tile, class:(jamesdsp|ONLYOFFICE)
windowrule = float, title:(.*Network Manager.*)

# wlogout rules
windowrule = float, move 0 0, size 100% 100%, noanim, class:(wlogout)

# Apache Directory Studio rules
windowrule = float, center, class:(ApacheDirectoryStudio)

windowrule = bordercolor $mauve $red, floating:1
windowrule = bordercolor $lavender $mauve, fullscreen:1
windowrule = opacity 0.8 0.8, pinned:1
# windowrule = group barred,floating:1

# steam/games rules
windowrule = workspace special:steam, class:^(steam)$, title:^(Sign in to Steam)$
windowrule = float, center, size 1600 960, workspace special:steam silent, class:^(steam)$, title:^(Steam)$
windowrule = workspace special:steam, class:^(steam)$, title:^(Steam)$
windowrule = fullscreen, class:^(Torchlight2.bin.x86_64)$, title:^(Torchlight II v.1.25.5.4)$

# teams rules
windowrule = idleinhibit focus, class:^(teams-for-linux)$

# zen rules
windowrule = float, title:^(Picture-in-Picture)$
windowrule = maxsize 800 800, class:(zen)

# noscreenshare rules
windowrule = noscreenshare, class:^(whatsappweb-nativefier-d40211)$
windowrule = noscreenshare, class:^(org.telegram.desktop)$
windowrule = noscreenshare, class:^(spotube)$
windowrule = noscreenshare, class:^(com.github.th_ch.youtube_music)$
windowrule = noscreenshare, class:^(steam)$, title:^(Steam)$

windowrule = float, size 900 750, center, class:^(waypaper|qt6ct|qt5ct)$

# https://github.com/shvedes/dotfiles/blob/9dbf2b3942083eec261a695e4c2430c694d343a1/src/.config/hypr/include/rules.conf#L137
# GNOME polkit
windowrule = dimaround, noshadow, class:(gcr-prompter)

# File pickers and same stuff
windowrule = float, size 1345 720, center, title:(Open folder.*)
windowrule = float, size 1345 720, center, title:(Open [Ff]iles)
windowrule = float, center, title:(Open|Publish as PDF or XPS|^Settings - .*|^Warning:.*)
windowrule = float, center, class:(com.gabm.satty)
windowrule = float, size 1345 720, center, title:([Ff]ile Upload)
windowrule = float, size 1345 720, center, title:(Enter name of file to save to.*)
windowrule = float, size 1345 720, center, class:(soffice|Save Image|Save As|xdg-desktop-portal-gtk)
windowrule = float, size 1345 720, center, title:(blob.*)

# xwaylandvideobridge
windowrule = opacity 0.0 override 0.0 override, noanim, nofocus, noinitialfocus, workspace special:junks silent, class:^(xwaylandvideobridge)$

# waybar yay update click, cava
windowrule = animation slide, float, size 60% 50%, move 380 35, class:^(update)$, title:^(update)$

# ttyclock
windowrule = float, size 33% 27%, center, class:^(clock)$, title:^(clock)$

# firefox textern
# ["kitty", "--class", "kitty", "--title", "textern", "-e", "/home/opal/.local/bin/av", "+call cursor(%l,%c)"]
windowrule = animation slide, float, pin, size 60% 50%, center, class:^(kitty)$, title:^(textern)$

# neovim anywhere
windowrule = animation slide, float, pin, size 60% 50%, center, class:^(nvim-hypr-anywhere)$

# terminal scratchpad
windowrule = animation slide, float, size 75% 65%, move 250 375, class:^(kitty)$, title:^(scratch)$

# no focus markdown preview
windowrule = nofocus, title:^(Peek preview)$

# tearing
windowrule = immediate, fullscreen,title:^(Grim Dawn)

