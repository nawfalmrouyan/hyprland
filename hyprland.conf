env = _JAVA_AWT_WM_NONREPARENTING,1
env = QT_QPA_PLATFORMTHEME,gtk3
env = QT_QPA_PLATFORMTHEME_QT6,gtk3
env = QT_QPA_PLATFORM,wayland
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = MOZ_ENABLE_WAYLAND,1
env = GDK_BACKEND,wayland,x11,*
env = PATH,$HOME/.bun/bin:$HOME/.local/bin:$HOME/.cargo/bin:$confDir/scripts:$PATH
env = GAMEMODERUNEXEC,env __NV_PRIME_RENDER_OFFLOAD=1 __GLX_VENDOR_LIBRARY_NAME=nvidia __VK_LAYER_NV_optimus=NVIDIA_only
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = HYPRCURSOR_THEME,catppuccin-mocha-mauve-cursors
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,catppuccin-mocha-mauve-cursors
env = XCURSOR_SIZE,24
env = HYPRLAND_NO_CRASHREPORTER,1
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# Variables
$mainMod = SUPER
$localBin = $HOME/.local/bin
$scriptsDir = $confDir/scripts
$confDir = $HOME/.config/hypr
$volume = $scriptsDir/volume
$backlight = /bin/brightnessctl
$screenshot = $scriptsDir/screenshot
$rofi_beats = $scriptsDir/rofi-beats
$music = youtube-music-for-desktop

# monitorv2 {
#   output = HDMI-A-1
#   mode = 1920x1080
#   position = 0x0
#   scale = 1
#   bitdepth = 8
# }

monitorv2 {
  output = eDP-1
  mode = 1920x1080
  position = 1920x0
  scale = 1
  bitdepth = 8
}

# workspace = 1, monitor:eDP-1, default:true
# workspace = 2, monitor:eDP-1, default:true
# workspace = 3, monitor:eDP-1, default:true
# workspace = 4, monitor:HDMI-A-1, default:true
# workspace = 5, monitor:HDMI-A-1, default:true
# workspace = 6, monitor:HDMI-A-1, default:true

source = $confDir/mocha.conf

input {
  kb_layout = us
  kb_variant = altgr-intl
  kb_options = compose:menu,level3:ralt_switch
  special_fallthrough = true
  follow_mouse = 1
  numlock_by_default = true
  repeat_rate = 25
  repeat_delay = 200

  touchpad {
    natural_scroll = true
    tap-to-click = true
    drag_lock = true
    disable_while_typing = true
  }
}

misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
  mouse_move_enables_dpms = true
  key_press_enables_dpms = true
  enable_swallow = true
  swallow_regex = kitty|com.mitchellh.ghostty
  swallow_exception_regex = ^(noswallow)$
  focus_on_activate = true
  allow_session_lock_restore = true
  font_family = Pragmasevka Aile SmBd Cn
  on_focus_under_fullscreen = 1
}

cursor {
  hide_on_touch = true
  hide_on_key_press = true
  persistent_warps = true
  warp_on_change_workspace = 1
  warp_on_toggle_special = 1
  default_monitor = eDP-1
}

binds {
  workspace_back_and_forth = true
  allow_pin_fullscreen = true
  movefocus_cycles_fullscreen = true
  movefocus_cycles_groupfirst = true
}

ecosystem {
  no_update_news = true
  no_donation_nag = true
}

debug {
  disable_logs = true
}

general {
  gaps_in = 0
  gaps_out = 0
  border_size = 0
  resize_on_border = true
  col.active_border = $mauve $blue 45deg
  col.inactive_border = $overlay0
  gaps_workspaces = 5
  float_gaps = 0
  layout = scrolling
  allow_tearing = true

  snap {
    enabled = true
    respect_gaps = true
    border_overlap = false
    window_gap = 5
    monitor_gap = 5
  }
}

group {
  col.border_active = $mauve $blue 45deg
  col.border_inactive = $overlay0
  col.border_locked_inactive = $red
  col.border_locked_active = $peach

  groupbar {
    font_family = Pragmasevka Aile SmBd Cn
    font_size = 15
    gradients = false
    col.active = $base
    col.inactive = $overlay0
    col.locked_inactive = $red
    col.locked_active = $peach
  }
}

decoration {
  rounding = 0
  dim_special = 0.3
  active_opacity = 1.0
  # inactive_opacity = 0.9
  fullscreen_opacity = 1.0

  blur {
    size = 1
    passes = 5
    vibrancy = 0.1696
    new_optimizations = true
    popups = true
  }

  shadow {
    enabled = true
    range = 11
    render_power = 2
    color = $mauve
  }

  # dim_inactive = true
  dim_strength = 0.7
  dim_special = 0.5
  dim_around = 0.5
}

render {
  new_render_scheduling = true
}

animations {
  enabled = true
  workspace_wraparound = true

  # Beziers
  bezier = simple, 0.16, 1, 0.3, 1
  bezier = smooth, 0.25, 0.1, 0.35, 0.15
  bezier = smoothOut, 0.36, 0, 0.66, -0.56
  bezier = smoothIn, 0.25, 1, 0.5, 1
  bezier = linear, 0.0, 0.0, 1.0, 1.0
  bezier = myBezier, 0.05, 0.9, 0.1, 1.05
  bezier = overshot, 0.05, 0.9, 0.1, 1.1
  bezier = cubic, 0.54, 0.22, 0.07, 0.74
  bezier = overshotCircle, 0.175, 0.885, 0.32, 1.275
  bezier = md3_standard, 0.2, 0.0, 0, 1.0
  bezier = bounce, 1, 1.6, 0.1, 0.85
  bezier = decel, 0.05, 0.7, 0.1, 1
  bezier = quick, 0.15, 0, 0.1,1

# Layers
  animation = layers, 1, 3, bounce, slidefadevert
  animation = layersIn, 1, 3, bounce, slidefadevert 90%
  animation = layersOut, 1, 3, bounce, slidefadevert 90%
# Zoom
  animation = zoomFactor, 1, 7, quick
# Windows
  animation = windows, 1, 2, md3_standard, slide 90%
  animation = windowsIn, 1, 3, smoothIn, popin 90%
  animation = windowsOut, 1, 7, smoothOut, popin 90%
  animation = windowsMove, 1, 6, md3_standard, slide 90%
# Border
  animation = border, 1, 10, overshot
  animation = borderangle, 1, 100, linear, loop
# Workspaces
  animation = workspaces, 1, 3, bounce, slidefadevert 90%
  animation = workspacesIn, 1, 3, bounce, slidefadevert 90%
  animation = workspacesOut, 1, 3, bounce, slidefadevert 90%
  animation = specialWorkspace, 1, 3, bounce, slidefadevert 90%
# Fade animations
  animation = fade, 1, 5, smooth                          # General fade animation
  animation = fadeIn, 1, 4, smooth                        # Smooth fade-in for windows
  animation = fadeOut, 1, 4, smooth                       # Smooth fade-out for windows
  animation = fadeSwitch, 1, 3, smooth                    # Quick fade for active window switch
  animation = fadeShadow, 1, 3, smooth                    # Smooth shadow fade
  animation = fadeDim, 1, 4, smooth                       # Smooth dimming of inactive windows
  animation = fadeLayers, 1, 4, smooth                    # Layer fade
  animation = fadePopups, 1, 3, smooth                    # Quick fade for popups
  animation = fadeDpms, 1, 5, smooth                      # Smooth fade for DPMS toggle
}

master {
  new_status = slave
  mfact = 0.5
  special_scale_factor = 0.9
  allow_small_split = true
  new_on_active = after
}

layerrule {
  name = layer-rules-popin
  match:namespace = logout_dialog|rofi|vicinae
  dim_around = on
  blur = on
  animation = popin
}

layerrule {
  name = layer-rules-slidefadevert
  match:namespace = ghostty-quick-terminal|kitty-quick-access
  blur = on
  above_lock = 2
  no_screen_share = on
}

layerrule {
  name = noscreenshare-swaync
  match:namespace = swaync.*|dms.*
  no_screen_share = on
}

layerrule {
  name = noscreenshare-dms
  match:namespace = dms.bar
  no_screen_share = off
}

windowrule {
  name = pulse-secure-rules
  match:class = pulseUI
  match:title = (Pulse Secure)
  float = on
  center = on
  size = 900 750
  workspace = special:pulsesecure
}

windowrule {
  name = forticlient-rules
  match:initial_class = FortiClient
  float = on
  center = on
  size = 900 750
  workspace = special:forticlient
}

windowrule { 
  name = chatapp-rules
  match:initial_class = com.rtosta.zapzap|whatsappweb-nativefier-d40211|org.telegram.desktop
  float = on,
  center = on,
  size = 1600 960
  workspace = special:whatsapp silent
}

windowrule { 
  name = youtube-music-rules
  match:class = com.github.th_ch.youtube_music|spotube|(YouTube Music for Desktop)
  float = on
  size = 1600 960
  center = on
  workspace = special:trash silent
}

windowrule { 
  name = showmethekey-rules
  match:class = showmethekey-gtk
  move = 1511 919
  float = on
  border_size = 0
  opacity = 1.0 override 1.0 override
  no_blur = on
  no_focus = on
  no_anim = on
  no_shadow = on
}

windowrule {
  name = onlyoffice-popups
  match:float = true
  match:class = DesktopEditors
  center = on
}

windowrule {
  name = center-float-windows-class
  match:class = jamesdsp|hyprland-share-picker|nm-connection-editor|pavucontrol|Gimp|org.quickshell
  float = on
  center = on
  size = 900 750
}

windowrule {
  name = persistent-size-windows
  match:class = qt5ct|qt6ct|ApacheDirectoryStudio|feh|FortiClient|yad
  float = on
  center = on
  # persistent_size = on
}

windowrule {
  name = satty-window
  match:class = com.gabm.satty
  float = on
  center = on
  min_size = 730 300
}

windowrule {
  name = center-float-windows-title
  match:title = Settings|Hyprshot|Open|(Publish as PDF or XPS|^Settings - .*|^Warning:.*)
  float = on
  center = on
  size = 900 750
}

# grouping rules
windowrule = group set, match:class whatsappweb-nativefier-d40211|org.telegram.desktop|spotube|com.github.th_ch.youtube_music|com.rtosta.zapzap|FortiClient|pulseUI
windowrule = group override barred, match:class kitty|zen|xdg-desktop-portal-gtk

# misc rules
windowrule = center on, match:title LibreOffice
windowrule = tile on, match:class ONLYOFFICE
windowrule = float on, match:title .*Network Manager.*

windowrule = border_color $mauve $red, match:float true
windowrule = border_color $lavender $mauve, match:fullscreen true
windowrule = opacity 0.8 0.8, match:pin true

windowrule {
  name = steam-window
  match:class = steam
  workspace = special:steam silent
  float = on
  center = on
  size = 1600 960
}

windowrule {
  name = steam
  match:class = steam
  match:title = Steam|(Sign in to Steam)
  workspace = special:steam silent
  float = on
  center = on
  size = 1600 960
}

windowrule {
  name = torchlight2
  match:class = Torchlight2.bin.x86_64
  match:title = (Torchlight II v.25.5.4)
  fullscreen = on
  content = game
}

# teams rules
windowrule {
  name = idle-inhibit-apps
  match:class = teams-for-linux
  idle_inhibit = focus
}

# zen rules
windowrule {
  name = zen-pip-rules
  match:class = zen
  match:title = Picture-in-Picture
  float = on
  max_size = 800 800
}

windowrule { 
  name = noscreenshare-rules
  match:class = whatsappweb-nativefier-d40211|org.telegram.desktop|spotube|com.github.th_ch.youtube_music|steam|com.rtosta.zapzap
  no_screen_share = on
}

windowrule { 
  name = noscreenshare-terminal
  match:title = noscreenshare
  no_screen_share = on
}

windowrule {
  name = center-float-app
  match:class = waypaper|qt6ct|qt5ct
  float = on
  size = 900 750
  center  = on
}

windowrule {
  name = picker-title-rules
  match:title = ([Ff]ile Upload)|(Enter name of file to save to.*)|(blob.*)|(Open [Ff]iles)|(Open folder.*)
  size = 1345 720
  float = on
  center = on
}

windowrule = float on, size 1345 720, center on, match:class (soffice|Save Image|Save As|xdg-desktop-portal-gtk)

windowrule {
  name = waybar-popups
  match:initial_class = (blueman-manager)|(com.network.manager)
  animation = slide
  stay_focused = on
  float = on
  size = 1280 700
  move = 380 35
}

# xwaylandvideobridge
windowrule {
  name = xwaylandvideobridge
  match:class = xwaylandvideobridge
  opacity = 0.0 override 0.0 override
  no_anim = on
  no_focus = on
  no_initial_focus = on
  workspace = special:junks silent
}

# waybar yay update click, cava
windowrule {
  name = tui-window
  match:class = update
  match:title = update
  animation = slide
  float = on
  size = 1280 700
  move = 380 43
}

windowrule {
  name = config-window
  match:class = org.netrs.ui
  animation = slide
  float = on
  size = 1280 700
  move = 380 35
}

# firefox textern
# ["kitty", "--class", "kitty", "--title", "textern", "-e", "/home/opal/.local/bin/av", "+call cursor(%l,%c)"]
windowrule {
  name = textern-window
  match:class = kitty
  match:title = textern
  animation = slide
  float = on
  pin = on
  size = 1280 700
  center = on
}

windowrule {
  name = nvim-hypr-anywhere
  match:class = nvim-hypr-anywhere
  animation = slide
  float = on
  pin = on
  size = 1280 700
  center = on
}

windowrule {
  name = terminal-scratchpad
  match:class = kitty
  match:title = scratch
  animation = slide
  float = on
  size = 1440 700
  move = 240 377
}

windowrule {
  name = no-focus-window
  match:title = ^(Peek preview)$
  no_focus = on
}

windowrule {
  name = enable-tearing
  match:title = (Grim Dawn)
  immediate = on
  content = game
}

windowrule {
  name = suppressevent-maximize
  match:class = .*
  suppress_event = maximize
}

bindd = $mainMod, T, Open Kitty with TMUX session:stuff, exec, kitty -1 -T stuff -e sesh connect stuff
bindd = $mainMod, Return, Open Kitty with no screen share, exec, kitty -1 -T noscreenshare
bindd = $mainMod SHIFT, Return, Open Kitty session, exec, kitty  -T stuff
# bindd = $mainMod CTRL, Return, Open Ghostty with TMUX session:WORK, exec, ghostty +new-window -e sesh connect WORK
bindd = $mainMod CTRL, Return, Open RSS feed reader - eilmeldung, exec, kitty -1 --class=eilmeldung -T eilmeldung -e eilmeldung
bindd = $mainMod, Q, Kill focused app, killactive,
bindd = $mainMod SHIFT, Q, Exit Hyprland session, exec, hyprshutdown -t 'Shutting down...' --post-cmd 'shutdown -P 0'
bindd = $mainMod, A, Open Outlook for Linux, exec, /opt/outlook-for-linux/outlook-for-linux --ozone-platform-hint=auto --enable-features=WebRTCPipeWireCapturer
bindd = $mainMod, F, Fullscreen focused app, fullscreen
bindd = $mainMod SHIFT, E, Open Nemo, exec, nemo
bindd = $mainMod, V, Toggle floating, togglefloating,
bindd = $mainMod SHIFT, L, Lock screen, exec, dms ipc lock lock
bindd = $mainMod, Escape, Open Powermenu dialog window, exec, dms ipc powermenu open

# rofi/vicinae/bemenu, etc
# bind = $mainMod, C, exec, pkill rofi || rofi -config $confDir/rofi/config.rasi -show drun
# bindr = $mainMod, Y, exec, pkill rofi ||  $rofi_beats
# bind = ALT, Tab, exec,  rofi -c $confDir/rofi/config.rasi -show window
bindd = $mainMod, 0, Vicinae password DB, exec, ROFI_PASS_CONFIG="$confDir/rofi-pass/config" rofi-pass
bindd = $mainMod, Y, Vicinae file search, exec, vicinae vicinae://extensions/vicinae/files/search
bindd = $mainMod SHIFT, Y, Rofi Beats - radio/music stream, exec, $scriptsDir/rofi-beats
bindd = ALT, Tab, Vicinae Alt-Tab, exec, vicinae vicinae://extensions/vicinae/wm/switch-windows
bindd = $mainMod, E, Vicinae emoji, exec, vicinae vicinae://extensions/vicinae/core/search-emojis
bindd = $mainMod, I, Vicinae history, exec, vicinae vicinae://extensions/vicinae/clipboard/history
bindd = $mainMod SHIFT, P, Vicinae power profiles, exec, $scriptsDir/powerprofiles.sh
binddr = $mainMod SHIFT, C, Bemenu, exec, pkill bemenu ||  $scriptsDir/bemenu_input 6

# compose text using nvim
bindd = $mainMod, N, Toggle nvim hypr anywhere, exec, $localBin/nvim-hypr-anywhere.sh

# bind = $mainMod, B, exec, killall -SIGUSR1 waybar || waybar
bindd = $mainMod SHIFT, B, Toggle game mode, exec, $scriptsDir/gamemode.sh

# Night mode (blue filter)
# bind = $mainMod, T, exec, hyprctl keyword decoration:screen_shader $scriptsDir/flux.glsl
# bind = $mainMod SHIFT, T, exec, hyprctl keyword decoration:screen_shader "[[EMPTY]]"

# Global keybinds
# bind = CTRL, Grave, global, :CTRL+grave
binddl = CTRL, Grave, Kitty quick terminal, exec, kitten quick-access-terminal

# wayscriber
# bindd = $mainMod, Z, Wayscriber, exec, pkill -SIGUSR1 wayscriber

# voxd
# bind = $mainMod SHIFT, Z, exec, bash -c 'voxd --trigger-record'

# toggle group
bindd = $mainMod, G, Toggle lock/unlock group or enable/disable group, exec, if [ $(hyprctl activewindow | rg 'grouped:' | rg -v 'Window' | tr -dc ',' | wc -c) -gt '0' ]; then hyprctl dispatch lockactivegroup toggle; else hyprctl dispatch togglegroup; fi
bindd = $mainMod, Tab, Cycle grouped apps, changegroupactive
bindd = $mainMod CTRL, G, Move app out of group, moveoutofgroup
bind = $mainMod SHIFT, G, submap, group
submap = group, reset
bindd = , J, Submap:group move app into below group, moveintogroup, d
bindd = , K, Submap:group move app into above group, moveintogroup, u
bindd = , L, Submap:group move app into right group, moveintogroup, r
bindd = , H, Submap:group move app into left group, moveintogroup, l
bind = , escape, submap, reset
submap = reset

# Screenshots
# bindd = , Print, Toggle screenshot dialog, exec, $scriptsDir/rofi-screenshot
# bindd = , Print, Screenshot, exec, dms screenshot --no-file -f jpg -q 85 --stdout | satty -f -
bindd = , Print, Toggle screenshot dialog, exec, $scriptsDir/dms-screenshot
bindd = $mainMod, X, Toggle hide/reveal dank bar, exec, dms ipc call bar toggle index 0

# Special Keys
binddel = , xf86audioraisevolume, Increase volume, exec,  $volume --inc
binddel = , xf86audiolowervolume, Lower volume, exec,  $volume --dec
binddl = , xf86audiomute, Toggle mute/unmute, exec,  $volume --toggle
# binddel = , xf86monbrightnessup, Increase brightness, exec,  $backlight s +5%
# binddel = , xf86monbrightnessdown, Lower brightness, exec,  $backlight s 5%-
binddl = , xf86audioplay, Pause player, exec,  playerctl play-pause
binddl = , xf86audionext, Play next track, exec,  playerctl next
binddl = , xf86audioprev, Play previous track, exec,  playerctl previous

# Bypass global keybinds to pass binds directly to application (eg: VMs)
bindd = $mainMod CTRL, Grave, Pass through keys, submap, passthru
submap = passthru
bind = $mainMod, Escape, submap, reset
submap = reset

# Disable all keybinds
bindd = $mainMod SHIFT CTRL, Disable all keybinds, Escape, submap, clean
submap = clean
bind = $mainMod, Escape, submap, reset
submap = reset

# Special workspace
bindu = $mainMod SHIFT, U, movetoworkspace, special:terminal
bindu = $mainMod, U, togglespecialworkspace, terminal
bindu = $mainMod SHIFT, Backspace, movetoworkspace, special:steam
bindu = $mainMod, Backspace, togglespecialworkspace, steam
bindu = $mainMod SHIFT, Delete, movetoworkspace, special:trash
bindu = $mainMod, Delete, togglespecialworkspace, trash
bindu = $mainMod SHIFT, O, movetoworkspace, special:whatsapp
bindu = $mainMod, O, togglespecialworkspace, whatsapp
bindu = $mainMod SHIFT, 6, movetoworkspace, special:pulsesecure
bindu = $mainMod, 6, togglespecialworkspace, pulsesecure
bindu = $mainMod SHIFT, 7, movetoworkspace, special:forticlient
bindu = $mainMod, 7, togglespecialworkspace, forticlient

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, split-workspace, 1
bind = $mainMod, 2, split-workspace, 2
bind = $mainMod, 3, split-workspace, 3

# Move active window and follow to workspace
bind = $mainMod CTRL, 1, split-movetoworkspace, 1
bind = $mainMod CTRL, 2, split-movetoworkspace, 2
bind = $mainMod CTRL, 3, split-movetoworkspace, 3

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, split-movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, split-movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, split-movetoworkspacesilent, 3

# Move/resize windows with mainMod + LMB/RMB and dragging
# mouse:272 = left
# mouse:273 = right
# mouse:274 = middle
# mouse:275 = side
# mouse:276 = extra
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bind = $mainMod, mouse:274, togglefloating
# bindm = , mouse:275, movewindow
# bindm = , mouse:276, resizewindow

# Zoom
bind = $mainMod, mouse_down, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 + 0.5}')
bind = $mainMod, mouse_up, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 - 0.5}')
bind = $mainMod SHIFT, mouse_up, exec, hyprctl -q keyword cursor:zoom_factor 1

# The second bind is redundant but I'm used to it in DWM
bind = $mainMod SHIFT CTRL, comma, exec, hyprctl dispatch swapactiveworkspaces 1 0
bind = $mainMod SHIFT CTRL, period, exec, hyprctl dispatch swapactiveworkspaces 0 1
bind = $mainMod SHIFT CTRL, left, exec, hyprctl dispatch swapactiveworkspaces 1 0
bind = $mainMod SHIFT CTRL, right, exec, hyprctl dispatch swapactiveworkspaces 0 1

# bind = $mainMod SHIFT, comma, movewindow, mon:HDMI-A-1
# bind = $mainMod SHIFT, period, movewindow, mon:eDP-1
bind = $mainMod SHIFT, comma, split-changemonitor, prev
bind = $mainMod SHIFT, period, split-changemonitor, next
bind = $mainMod ALT, comma, split-changemonitorsilent, prev
bind = $mainMod ALT, period, split-changemonitorsilent, next

# focus monitor.
bind = $mainMod, comma, focusmonitor, l
bind = $mainMod, period, focusmonitor, r

# swap workspaces between monitors
bind = $mainMod, 4, swapactiveworkspaces, eDP-1 HDMI-A-1

# laptop lid switch
bindl = , switch:on:Lid Switch, exec, hyprctl keyword monitor "eDP-1, 1920x1080, 1920x0, 1"
bindl = , switch:off:Lid Switch, exec, hyprctl keyword monitor "eDP-1, disable"

## Plugins
source = $confDir/split-monitor-workspaces.conf
# source = $confDir/hyprscroller.conf
source = $confDir/hyprscrolling.conf
source = $confDir/wl-kbptr.conf
# source = $confDir/hypr-dynamic-cursors.conf

## Source local config (yadm)
## symlink creation is handled by yadm
source = $confDir/local.conf

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
# exec-once = $scriptsDir/hswbstartup.sh
# exec-once = socat -u UNIX-CONNECT:$XDG_RUNTIME_DIR/hypr/$HYPRLAND_INSTANCE_SIGNATURE/.socket2.sock EXEC:"/home/opal/.config/hypr/scripts/shellevents /home/opal/.config/hypr/scripts/submaps.sh",nofork
exec-once = jamesdsp --tray
exec-once = hyprpm reload
exec-once = vicinae server
exec-once = hypridle
# exec-once = wayscriber --daemon
exec-once = dms run

# forcefully kill processes (uwsm sometimes causes slow shutdown)
exec-shutdown = pkill -9 zapzap
exec-shutdown = pkill -9 WhatsAppWeb
exec-shutdown = pkill -9 kanata
exec-shutdown = pkill -9 kitty
exec-shutdown = pkill -9 jamesdsp
exec-shutdown = pkill -9 outlook
exec-shutdown = pkill -9 hypridle
exec-shutdown = pkill -9 vicinae
# exec-shutdown = pkill -9 wayscriber

workspace = special:terminal, on-created-empty:kitty -1 --title scratch -e sesh connect WORK
workspace = special:trash, on-created-empty:$music
workspace = special:whatsapp, on-created-empty:/home/opal/.config/WhatsAppWeb-linux-x64/WhatsAppWeb --ozone-platform-hint=auto --enable-features=WebRTCPipeWireCapturer
# workspace = special:whatsapp, on-created-empty:zapzap
workspace = special:steam, on-created-empty:steam
workspace = special:update, on-created-empty:kitty --class=update -T update -e yay -Syu
workspace = special:pulsemixer, on-created-empty:kitty --class=update -T update -e pulsemixer
workspace = special:pulsesecure, on-created-empty:/opt/pulsesecure/bin/pulseUI
workspace = special:forticlient, on-created-empty:/opt/forticlient/gui/FortiClient
