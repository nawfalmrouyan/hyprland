# Bypass global keybinds to pass binds directly to application (eg: VMs)
bind = $mainMod CTRL, Grave, submap, passthru
submap = passthru
bind = $mainMod, Escape, submap, reset
submap = reset

# Disable all keybinds
bind = $mainMod SHIFT CTRL, Escape, submap, clean
submap = clean
bind = $mainMod, Escape, submap, reset
submap = reset

# Special workspace
bind = $mainMod SHIFT, U, movetoworkspace, special:terminal
bind = $mainMod, U, togglespecialworkspace, terminal
bind = $mainMod SHIFT, Backspace, movetoworkspace, special:steam
bind = $mainMod, Backspace, togglespecialworkspace, steam
bind = $mainMod SHIFT, Delete, movetoworkspace, special:trash
bind = $mainMod, Delete, togglespecialworkspace, trash
bind = $mainMod SHIFT, O, movetoworkspace, special:whatsapp
bind = $mainMod, O, togglespecialworkspace, whatsapp
# bind = $mainMod SHIFT, I, movetoworkspace, special:clipse
# bind = $mainMod, I, togglespecialworkspace, clipse

# clipse-gui config
windowrule = float, class:(clipse-gui)
# windowrule = stayfocused, class:(clipse-gui)
windowrule = size 600 750, class:(clipse-gui)
# bind = $mainMod, I, exec, app2unit -- clipse-gui
bind = $mainMod, I, exec, app2unit -- vicinae vicinae://extensions/vicinae/clipboard/history

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, split-workspace, 1
bind = $mainMod, 2, split-workspace, 2
bind = $mainMod, 3, split-workspace, 3
bind = $mainMod, 4, split-workspace, 4
# bind = $mainMod, 5, split-workspace, 5
# bind = $mainMod, 6, split-workspace, 6
# bind = $mainMod, 7, split-workspace, 7
# bind = $mainMod, 8, split-workspace, 8
# bind = $mainMod, 9, split-workspace, 9
# bind = $mainMod, 0, split-workspace, 10
# bind = $mainMod, Grave, split-workspace, empty # The key before '1' (backtick/tilde)

# Move active window and follow to workspace
bind = $mainMod CTRL, 1, split-movetoworkspace, 1
bind = $mainMod CTRL, 2, split-movetoworkspace, 2
bind = $mainMod CTRL, 3, split-movetoworkspace, 3
bind = $mainMod CTRL, 4, split-movetoworkspace, 4
# bind = $mainMod CTRL, 5, split-movetoworkspace, 5
# bind = $mainMod CTRL, 6, split-movetoworkspace, 6
# bind = $mainMod CTRL, 7, split-movetoworkspace, 7
# bind = $mainMod CTRL, 8, split-movetoworkspace, 8
# bind = $mainMod CTRL, 9, split-movetoworkspace, 9
# bind = $mainMod CTRL, 0, split-movetoworkspace, 10
# bind = $mainMod CTRL, Grave, split-movetoworkspace, empty
# bind = $mainMod CTRL, bracketleft, split-movetoworkspace, -1
# bind = $mainMod CTRL, bracketright, split-movetoworkspace, +1

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, split-movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, split-movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, split-movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, split-movetoworkspacesilent, 4
# bind = $mainMod SHIFT, 5, split-movetoworkspacesilent, 5
# bind = $mainMod SHIFT, 6, split-movetoworkspacesilent, 6
# bind = $mainMod SHIFT, 7, split-movetoworkspacesilent, 7
# bind = $mainMod SHIFT, 8, split-movetoworkspacesilent, 8
# bind = $mainMod SHIFT, 9, split-movetoworkspacesilent, 9
# bind = $mainMod SHIFT, 0, split-movetoworkspacesilent, 10
# bind = $mainMod SHIFT, Grave, split-movetoworkspacesilent, empty
# bind = $mainMod SHIFT, bracketleft, split-movetoworkspacesilent, -1
# bind = $mainMod SHIFT, bracketright, split-movetoworkspacesilent, +1

# Scroll through existing workspaces with mainMod + scroll
# bind = $mainMod, mouse_down, workspace, e+1
# bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
# mouse:272 = left
# mouse:273 = right
# mouse:274 = middle
# mouse:275 = side
# mouse:276 = extra
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bind = $mainMod, mouse:274, togglefloating
# bindm = , mouse:275, movewindow
# bindm = , mouse:276, resizewindow

# Zoom
bind = $mainMod, mouse_down, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 + 0.5}')
bind = $mainMod, mouse_up, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 - 0.5}')
bind = $mainMod SHIFT, mouse_up, exec, hyprctl -q keyword cursor:zoom_factor 1

# The second bind is redundant but I'm used to it in DWM
bind = $mainMod SHIFT CTRL, comma, exec, hyprctl dispatch swapactiveworkspaces 1 0
bind = $mainMod SHIFT CTRL, period, exec, hyprctl dispatch swapactiveworkspaces 0 1
bind = $mainMod SHIFT CTRL, left, exec, hyprctl dispatch swapactiveworkspaces 1 0
bind = $mainMod SHIFT CTRL, right, exec, hyprctl dispatch swapactiveworkspaces 0 1

bind = $mainMod SHIFT, comma, exec, hyprctl dispatch split-changemonitor prev
bind = $mainMod SHIFT, period, exec, hyprctl dispatch split-changemonitor next
bind = $mainMod ALT, comma, exec, hyprctl dispatch split-changemonitorsilent prev
bind = $mainMod ALT, period, exec, hyprctl dispatch split-changemonitorsilent next
# focus monitor.
bind = $mainMod, comma, focusmonitor, l
# bind = $mainMod, bracketleft, workspace, e-1
bind = $mainMod, period, focusmonitor, r
# bind = $mainMod, bracketright, workspace, e+1

# move
bind = SHIFTALT, comma, movecurrentworkspacetomonitor, l
bind = SHIFTALT, period, movecurrentworkspacetomonitor, r

# grab rogue windows
# bind = SHIFTALT, slash, split-grabroguewindows
# bind = $mainMod SHIFT CTRL, bracketright, split-swapactiveworkspaces, current +1
# bind = $mainMod SHIFT CTRL, bracketleft, split-swapactiveworkspaces, current +1

# plugin: xtra-dispatchers
# bind = $mainMod, semicolon, plugin:xtd:throwunfocused, special:void
# bind = $mainMod SHIFT, semicolon, plugin:xtd:bringallfrom, special:void

bind = $mainMod, S, exec, hyprctl dispatch toggleswallow

# laptop lid switch
bindl = , switch:on:Lid Switch, exec, hyprctl keyword monitor "eDP-1, 1920x1080, 1920x0, 1"
bindl = , switch:off:Lid Switch, exec, hyprctl keyword monitor "eDP-1, disable"

## Plugins
source = $confDir/hyprtasking.conf
source = $confDir/split-monitor-workspaces.conf
source = $confDir/hyprscroller.conf
source = $confDir/wl-kbptr.conf

## Source local config (yadm)
## symlink creation is handled by yadm
source = $confDir/local.conf

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = app2unit -- $scriptsDir/scroller_mode_listener.sh
exec-once = app2unit -- hyprpm reload -nn && hyprctl dismissnotify
exec-once = app2unit --  $scriptsDir/import-gsettings
# exec-once = [workspace special:junks silent] app2unit --  xwaylandvideobridge
# exec-once = app2unit --  hyprpanel
exec-once = app2unit -- mako -c $confDir/mako/config
exec-once = app2unit -- waybar -c $confDir/waybar/config -s $confDir/waybar/style.css
exec-once = app2unit --  kanata_cmd_allowed -c $confDir/kanata/lappy.kbd
# GTK4 cursor size bug fix
exec-once = dconf write /org/gnome/desktop/interface/cursor-size 24
# exec-once = app2unit -- hyprlax $confDir/bg/cache.png
exec-once = app2unit --  hyprlock
# exec-once = app2unit --  /usr/lib/polkit-kde-authentication-agent-1
# exec-once = gnome-keyring-daemon --start --components=secrets
# exec-once = [workspace special:junks silent] app2unit --  xwaylandvideobridge
# exec-once = app2unit -- vicinae server

# smart gaps, no_border_when_only
# workspace = w[tv1]s[0], gapsout:0, gapsin:0
# workspace = f[1]s[0], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]s[0]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]s[0]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]s[0]
# windowrule = rounding 0, floating:0, onworkspace:f[1]s[0]

workspace = previous_per_monitor
workspace = special:terminal, on-created-empty:app2unit -- $term -1 --title scratch -e sesh connect WORK
workspace = special:trash, on-created-empty:app2unit -- $music
workspace = special:whatsapp, on-created-empty:app2unit -- $HOME/.config/WhatsAppWeb-linux-x64/WhatsAppWeb --ozone-platform-hint=auto --enable-features=WebRTCPipeWireCapturer
workspace = special:steam, on-created-empty:app2unit -- steam
workspace = special:update, on-created-empty:app2unit --  $term --class=update -T update -e yay -Syu
workspace = special:pulsemixer, on-created-empty:app2unit --  $term --class=update -T update -e pulsemixer
# workspace = special:clipse, on-created-empty:app2unit -- $term --class=kitty -T textern -e clipse
# workspace = special:clipse, on-created-empty:app2unit -- clipse-gui
# workspace = 6, on-created-empty:app2unit -- remmina
# workspace = 7, on-created-empty:app2unit -- teams-for-linux
workspace = 4, on-created-empty:app2unit -- $term -1 --class=workTerminal -T noswallow -o background_opacity=0.5 -e sesh connect Projects
# workspace = 17, on-created-empty:app2unit -- $term -1 --class=workTerminal2 -T noswallow -o background_opacity=0.5 -e sesh connect Projects
# workspace = 8, on-created-empty:app2unit -- ghostty --class=workTerminal --title=noswallow --background-opacity=1 -e sesh connect Project
