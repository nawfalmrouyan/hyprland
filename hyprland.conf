# bind = $mainMod CTRL, 0, split-movetoworkspace, 10
# bind = $mainMod CTRL, Grave, split-movetoworkspace, empty
# bind = $mainMod CTRL, bracketleft, split-movetoworkspace, -1
# bind = $mainMod CTRL, bracketright, split-movetoworkspace, +1

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, split-movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, split-movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, split-movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, split-movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, split-movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, split-movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, split-movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, split-movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, split-movetoworkspacesilent, 9
# bind = $mainMod SHIFT, 0, split-movetoworkspacesilent, 10
# bind = $mainMod SHIFT, Grave, split-movetoworkspacesilent, empty
# bind = $mainMod SHIFT, bracketleft, split-movetoworkspacesilent, -1
# bind = $mainMod SHIFT, bracketright, split-movetoworkspacesilent, +1

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
# mouse:272 = left
# mouse:273 = right
# mouse:274 = middle
# mouse:275 = side
# mouse:276 = extra
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bind = $mainMod, mouse:274, togglefloating
bindm = , mouse:275, movewindow
bindm = , mouse:276, resizewindow

# Zoom
# bind = $mainMod, mouse_down, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 + 0.5}')
# bind = $mainMod, mouse_up, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 - 0.5}')
# bind = $mainMod SHIFT, mouse_up, exec, hyprctl -q keyword cursor:zoom_factor 1

# The second bind is redundant but I'm used to it in DWM
bind = $mainMod SHIFT CTRL, comma, exec, hyprctl dispatch swapactiveworkspaces 1 0
bind = $mainMod SHIFT CTRL, period, exec, hyprctl dispatch swapactiveworkspaces 0 1
bind = $mainMod SHIFT CTRL, left, exec, hyprctl dispatch swapactiveworkspaces 1 0
bind = $mainMod SHIFT CTRL, right, exec, hyprctl dispatch swapactiveworkspaces 0 1

bind = $mainMod SHIFT, comma, exec, hyprctl dispatch split-changemonitor prev
bind = $mainMod SHIFT, period, exec, hyprctl dispatch split-changemonitor next
bind = $mainMod ALT, comma, exec, hyprctl dispatch split-changemonitorsilent prev
bind = $mainMod ALT, period, exec, hyprctl dispatch split-changemonitorsilent next
# focus monitor.
bind = $mainMod, comma, focusmonitor, l
# bind = $mainMod, bracketleft, workspace, e-1
bind = $mainMod, period, focusmonitor, r
# bind = $mainMod, bracketright, workspace, e+1

# move
# bind = SHIFTALT, comma, movecurrentworkspacetomonitor, l
# bind = SHIFTALT, period, movecurrentworkspacetomonitor, r

# grab rogue windows
bind = SHIFTALT, slash, split-grabroguewindows
# bind = $mainMod SHIFT CTRL, bracketright, split-swapactiveworkspaces, current +1
# bind = $mainMod SHIFT CTRL, bracketleft, split-swapactiveworkspaces, current +1

# plugin: xtra-dispatchers
# bind = $mainMod, semicolon, plugin:xtd:throwunfocused, special:void
# bind = $mainMod SHIFT, semicolon, plugin:xtd:bringallfrom, special:void

bind = $mainMod, S, exec, hyprctl dispatch toggleswallow

# laptop lid switch
bindl = , switch:on:Lid Switch, exec, hyprctl keyword monitor "eDP-1, 1920x1080, 1920x0, 1"
bindl = , switch:off:Lid Switch, exec, hyprctl keyword monitor "eDP-1, disable"

## Plugins
# source = $confDir/hyprexpo.conf
# source = $confDir/hyprsplit.conf
source = $confDir/hyprtasking.conf
# source = $confDir/hyprspace.conf
# source = $confDir/hyprgrass.conf
source = $confDir/split-monitor-workspaces.conf
source = $confDir/wl-kbptr.conf

## Source local config (yadm)
## symlink creation is handled by yadm
source = $confDir/local.conf

exec-once = uwsm app -- hyprpm reload -n
exec-once = uwsm app -- $scriptsDir/import-gsettings
# exec-once = uwsm app -- /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = uwsm app -- clipse --listen
# exec-once = [workspace special:junks silent] uwsm app -- xwaylandvideobridge
exec-once = uwsm app -- hyprpanel
exec-once = uwsm app -- kanata -c $confDir/kanata/lappy.kbd
# GTK4 cursor size bug fix
exec-once = dconf write /org/gnome/desktop/interface/cursor-size 24

# smart gaps, no_border_when_only
workspace = w[tv1] s[0], gapsout:0, gapsin:0
workspace = w[tg1] s[0], gapsout:0, gapsin:0
workspace = f[1] s[0], gapsout:0, gapsin:0
windowrule = bordersize 0, floating:0, onworkspace:w[tv1] s[0]
windowrule = rounding 0, floating:0, onworkspace:w[tv1] s[0]
windowrule = bordersize 0, floating:0, onworkspace:w[tg1] s[0]
windowrule = rounding 0, floating:0, onworkspace:w[tg1] s[0]
windowrule = bordersize 0, floating:0, onworkspace:f[1] s[0]
windowrule = rounding 0, floating:0, onworkspace:f[1] s[0]

# workspace = previous_per_monitor
workspace = special:terminal, on-created-empty:uwsm app -- $term -1 --title scratch -e sesh connect work
# workspace = special:terminal, on-created-empty:uwsm app -- $term -1 --title scratch -e tt work
workspace = special:trash, on-created-empty:uwsm app -- $music2
workspace = special:whatsapp, on-created-empty:uwsm app -- $HOME/.config/WhatsAppWeb-linux-x64/WhatsAppWeb --ozone-platform-hint=auto --enable-features=WebRTCPipeWireCapturer
workspace = special:steam, on-created-empty:uwsm app -- steam
workspace = special:update, on-created-empty:uwsm app -- $term --class=update -T update -e yay -Syu
workspace = special:clipse, on-created-empty:uwsm app -- $term --class=kitty -T textern -e clipse
workspace = 6, on-created-empty:uwsm app -- remmina
workspace = 7, on-created-empty:uwsm app -- teams-for-linux
# workspace = 8, on-created-empty:uwsm app -- $term -1 --class=workTerminal -T noswallow -o background_opacity=1.0 -e sesh connect Project
workspace = 8, on-created-empty:uwsm app -- ghostty --class=workTerminal --title=noswallow --background-opacity=1 -e sesh connect Project
workspace = 17, on-created-empty:uwsm app -- $term -1 --class=workTerminal2 -T noswallow -o background_opacity=1.0 -e sesh connect Project
