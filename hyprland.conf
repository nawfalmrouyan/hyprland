exec-once = $scriptsDir/hswbstartup.sh
exec-once = /usr/bin/jamesdsp --tray
exec-once = hyprpm reload -nn && hyprctl dismissnotify
exec-once = $scriptsDir/import-gsettings
# exec-once = mako -c $confDir/mako/config
exec-once = swaync
exec-once = waybar -c $confDir/waybar/config -s $confDir/waybar/style.css
exec-once =  kanata_cmd_allowed -c $confDir/kanata/lappy.kbd
# GTK4 cursor size bug fix
exec-once = dconf write /org/gnome/desktop/interface/cursor-size 24
exec-once = USE_LAYER_SHELL=0 vicinae server
exec-once = hyprpaper
exec-once = hypridle
exec-once = /lib64/hyprpolkitagent/hyprpolkitagent

# forcefully kill processes (uwsm sometimes causes slow shutdown)
exec-shutdown = pkill -9 WhatsAppWeb
exec-shutdown = pkill -9 mako
exec-shutdown = pkill -9 waybar
exec-shutdown = pkill -9 kanata
exec-shutdown = pkill -9 hswbstartu
exec-shutdown = pkill -9 kitty
exec-shutdown = pkill -9 jamesdsp
exec-shutdown = pkill -9 outlook
exec-shutdown = pkill -9 hyprpaper
exec-shutdown = pkill -9 hypridle
exec-shutdown = pkill -9 vicinae
exec-shutdown = mmuvpnc down

